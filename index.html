<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGU-Lab | Hokkai Gakuen University Baseball Lab</title>
<style>
:root {
  --navy:#071b50; --blue:#1768c5; --cyan:#1598c5; --purple:#6657d8; --gold:#d9a62f;
  --ink:#10244c; --muted:#64748b;
}
* { box-sizing:border-box; }
body {
  margin:0; min-height:100vh; color:var(--ink);
  font-family: "Avenir Next", "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
  background:
    radial-gradient(ellipse at 78% 10%, rgba(87,145,210,.18), transparent 32%),
    linear-gradient(135deg,#fff 0%,#f4f7fc 55%,#eaf0fa 100%);
  overflow-x:hidden;
}
body:before {
  content:""; position:fixed; inset:0; pointer-events:none; opacity:.22;
  background: repeating-linear-gradient(135deg, transparent 0 100px, rgba(18,54,112,.06) 101px 103px);
}
.wrap { width:min(1440px, 100%); margin:auto; padding:clamp(18px,4vw,56px); position:relative; }
.header { display:flex; align-items:center; gap:clamp(14px,2.5vw,34px); min-height:210px; }
.crest { width:clamp(76px,12vw,150px); object-fit:contain; flex-shrink:0; }
.brand-divider { width:2px; height:clamp(100px,12vw,150px); background:var(--navy); opacity:.7; }
.brand { min-width:0; }
.brand img { width:clamp(240px,42vw,560px); max-width:100%; object-fit:contain; display:block; }
.tagline { margin:10px 0 0; text-align:right; font-family:Georgia,serif; font-style:italic; font-size:clamp(18px,2.5vw,34px); color:#152e61; }
.hero-stadium { height:clamp(100px,16vw,210px); flex:1; min-width:100px; border-radius:14px; margin-left:10px;
  background:linear-gradient(90deg,rgba(255,255,255,.2),rgba(15,48,100,.15)),linear-gradient(180deg,#dce8f8,#9db8da);
  position:relative; overflow:hidden; border-bottom:3px solid rgba(14,39,85,.14); }
.hero-stadium:before { content:""; position:absolute; left:-8%; right:-8%; bottom:-40%; height:90%; border-radius:50%;
  background:repeating-linear-gradient(90deg,#eaf1fb 0 8px,#c9d9ef 9px 11px); transform:perspective(180px) rotateX(22deg); }
.hero-stadium:after { content:""; position:absolute; inset:0; background:linear-gradient(90deg,transparent,rgba(255,255,255,.55)); }
.section-title { text-align:center; margin:clamp(30px,5vw,60px) 0 26px; letter-spacing:.18em; font-size:clamp(12px,1.3vw,16px); font-weight:800; color:#23416f; }
.section-title span { display:block; font-size:clamp(22px,3vw,32px); letter-spacing:.04em; margin-bottom:7px; }
.cards { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:clamp(12px,2.3vw,30px); }
.card { position:relative; min-height:clamp(250px,29vw,390px); overflow:hidden; border-radius:34px; border:2px solid rgba(255,255,255,.9);
  box-shadow:0 12px 24px rgba(13,38,87,.22), inset 0 0 0 1px rgba(255,255,255,.24);
  text-decoration:none; color:white; display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:24px 14px; background:linear-gradient(155deg,var(--accent),#09204f 52%,#06163e); isolation:isolate;
  transform:translateY(0); transition:transform .22s ease, box-shadow .22s ease; }
.card:before { content:""; position:absolute; inset:0; z-index:-1; opacity:.16;
  background:radial-gradient(circle at 22% 25%,white 0 2px,transparent 3px), repeating-linear-gradient(135deg,transparent 0 18px,rgba(255,255,255,.12) 19px 20px); }
.card:after { content:""; position:absolute; left:-18%; right:-18%; bottom:-16%; height:28%; transform:rotate(-13deg);
  background:linear-gradient(90deg,transparent,var(--accent),rgba(255,255,255,.25),var(--accent)); opacity:.9; z-index:-1; }
.card:hover { transform:translateY(-7px); box-shadow:0 18px 30px rgba(13,38,87,.28); }
.card:focus-visible { outline:4px solid #f8d64e; outline-offset:4px; }
.card .icon { width:clamp(66px,8vw,112px); height:clamp(66px,8vw,112px); margin-bottom:22px; filter:drop-shadow(0 4px 6px rgba(0,0,0,.18)); }
.card h2 { margin:0; text-align:center; font-size:clamp(17px,2vw,28px); line-height:1.35; font-weight:800; letter-spacing:.04em; }
.card .en { margin-top:10px; font-size:clamp(10px,1.2vw,15px); font-weight:700; letter-spacing:.19em; text-align:center; }
.rule { width:48px; height:2px; background:rgba(255,255,255,.75); margin:16px 0; }
.arrow { display:grid; place-items:center; width:42px; height:42px; border-radius:50%; background:#fff; color:#0a2355; font-size:26px; font-weight:bold; }
.game { --accent:#1975d5; } .performance { --accent:#159ac2; } .physical { --accent:#7561df; } .player { --accent:#d9a62f; }
.footer { display:flex; align-items:center; justify-content:center; gap:20px; margin:clamp(40px,7vw,85px) 0 18px; color:#172f60; font-size:clamp(10px,1.2vw,15px); letter-spacing:.2em; font-weight:800; text-align:center; }
.footer:before,.footer:after { content:""; height:2px; width:clamp(30px,9vw,110px); background:#172f60; }
.baseball-seams { position:absolute; right:-60px; bottom:35px; width:250px; height:100px; border:10px solid rgba(111,145,194,.13); border-radius:50%; transform:rotate(-25deg); pointer-events:none; }
.note { text-align:center; color:#718096; font-size:12px; margin-top:15px; }
@media(max-width:900px) {
 .header { flex-wrap:wrap; } .hero-stadium { display:none; } .tagline { text-align:left; }
 .cards { grid-template-columns:repeat(2,minmax(0,1fr)); }
 .card { min-height:260px; border-radius:28px; }
}
@media(max-width:480px) {
 .wrap { padding:18px 14px 30px; } .header { gap:12px; min-height:120px; }
 .crest { width:62px; } .brand-divider { height:80px; } .brand img { width:calc(100vw - 120px); }
 .tagline { font-size:16px; } .cards { gap:12px; }
 .card { min-height:220px; padding:16px 9px; border-radius:24px; }
 .card .icon { width:58px; height:58px; margin-bottom:16px; }
 .card h2 { font-size:16px; } .card .en { font-size:9px; letter-spacing:.12em; }
 .arrow { width:34px; height:34px; font-size:21px; }
}

/* Combined HOKKAI baseball club + HGU-Lab brand logo */
.header.combined-header {
  display:block;
  min-height:0;
  margin:0 auto;
  padding:clamp(6px,1.2vw,14px) 0;
}
.combined-logo {
  display:block;
  width:100%;
  max-width:1060px;
  height:auto;
  object-fit:contain;
  margin:0 auto;
}
@media(max-width:480px) {
  .header.combined-header { padding:4px 0; }
  .combined-logo { width:100%; }
}
</style>
</head>
