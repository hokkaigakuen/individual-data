<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HGU BASEBALL LAB | 個人ページ</title>
<style>
:root{--navy:#102b4e;--blue:#1e5b96;--pale:#edf4fb;--line:#d9e2ec;--text:#1e293b;--muted:#64748b}
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
header{background:linear-gradient(120deg,#102b4e,#1e5b96);color:white;padding:25px 20px}
.wrap{max-width:1050px;margin:auto}header .eyebrow{font-size:12px;letter-spacing:.14em;opacity:.8}h1{font-size:clamp(22px,4vw,30px);margin:7px 0}header p{margin:0;color:#dce9f7;font-size:14px}
main{max-width:1050px;margin:22px auto;padding:0 16px 40px}
.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:18px;box-shadow:0 4px 16px #102b4e08}
.panel h2{font-size:17px;margin:0 0 14px;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
label{display:block;font-size:13px;font-weight:700;color:#334155;margin-bottom:6px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;background:white;color:var(--text);font:inherit}
input[type=file]{padding:8px;background:#f8fafc}
button{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}
.primary{background:var(--blue);color:white}.secondary{background:#e8eef5;color:var(--navy)}.danger{background:#fff0f0;color:#b42318;padding:7px 10px;font-size:12px}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:13px}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin:9px 0 0}
.selector{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tabs{display:flex;gap:8px;margin-bottom:14px}.tab{flex:1;background:#e8eef5;color:#334155}.tab.active{background:var(--navy);color:white}
.results-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.results-head h2{margin:0}.count{font-size:12px;color:var(--muted)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;margin-top:15px}
.item{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}
.item-top{padding:13px 14px;background:#f8fafc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.item-title{font-weight:800;color:var(--navy);overflow-wrap:anywhere}.item-meta{font-size:11px;color:var(--muted);margin-top:4px}
.item-body{padding:13px}.item img{display:block;width:100%;height:min(70vh,620px);max-height:620px;object-fit:contain;border-radius:8px;background:#f1f5f9}
@media(max-width:540px){.item img{height:min(60vh,480px);max-height:480px}}
.link-card{display:flex;align-items:center;gap:10px;padding:14px;border-radius:10px;background:var(--pale);color:var(--blue);text-decoration:none;font-weight:700;overflow-wrap:anywhere}
.link-card:hover{background:#dceaf8}.link-icon{font-size:20px}
.empty{padding:25px;text-align:center;color:var(--muted);background:#f8fafc;border:1px dashed var(--line);border-radius:12px}
.hidden{display:none!important}
@media(max-width:540px){.selector{grid-template-columns:1fr}header{padding:20px 16px}.panel{padding:14px}}
</style>
</head>
<body>
<header><div class="wrap"><div class="eyebrow">HGU BASEBALL LAB</div><h1>個人ページ</h1><p>選手ごとの分析資料・画像・関連リンクをまとめて確認</p></div></header>
<main>
<section class="panel">
<h2>資料・リンクを登録</h2>
<div class="grid">
<div><label for="kind">登録する内容</label><select id="kind"><option value="png">PNG画像・資料</option><option value="link">リンク</option></select></div>
<div><label for="position">区分</label><select id="position"><option value="野手">野手</option><option value="投手">投手</option></select></div>
<div><label for="player">選手名</label><input id="player" placeholder="例：山田 太郎" autocomplete="off"></div>
<div><label for="title">表示名（資料名／リンク先の名前）</label><input id="title" placeholder="例：打撃分析レポート"></div>
<div id="fileWrap"><label for="file">PNGファイル</label><input id="file" type="file" accept="image/png"></div>
<div id="urlWrap" class="hidden"><label for="url">リンクURL</label><input id="url" type="url" placeholder="https://..."></div>
</div>
<div class="actions"><button class="primary" id="add">登録する</button><button class="secondary" id="clearForm" type="button">入力をクリア</button></div>
<p class="hint">PNGは登録後、資料一覧で画像が開いた状態（そのまま表示）になります。リンクは設定した表示名で掲載されます。</p>
</section>

<section class="panel">
<h2>選手を選択して資料を見る</h2>
<div class="tabs"><button class="tab active" data-position="野手">野手</button><button class="tab" data-position="投手">投手</button></div>
<div class="selector">
<div><label for="filterPlayer">選手名</label><select id="filterPlayer"><option value="">選手を選択してください</option></select></div>
<div><label>表示対象</label><div id="selectionSummary" style="padding:11px 12px;border-radius:10px;background:#f8fafc;color:#64748b;font-size:14px">区分と選手名を選ぶと資料が表示されます</div></div>
</div>
</section>

<section class="panel">
<div class="results-head"><h2 id="listTitle">野手の資料</h2><span class="count" id="count">0件</span></div>
<div id="cards" class="cards"><div class="empty">区分と選手名を選択してください。</div></div>
</section>
<p class="hint">※このHTML版はデータを利用中のブラウザ内に保存します。別の端末・ブラウザとの共有にはFirebase等のデータベース接続が必要です。画像はブラウザ内に保存するため、大きなPNGを多数登録すると保存容量に達する場合があります。</p>
</main>
<script>
const $=id=>document.getElementById(id);
let entries=[];
let activePosition='野手';
const DB_KEY='hguLabIndividualPage_v1';
function load(){try{entries=JSON.parse(localStorage.getItem(DB_KEY)||'[]')}catch(e){entries=[]}}
function save(){localStorage.setItem(DB_KEY,JSON.stringify(entries))}
function refreshNames(){
 const current=$('filterPlayer').value;
 const names=[...new Set(entries.filter(x=>x.position===activePosition).map(x=>x.player))].sort((a,b)=>a.localeCompare(b,'ja'));
 $('filterPlayer').innerHTML='<option value="">選手を選択してください</option>'+names.map(n=>`<option value="${escapeHtml(n)}">${escapeHtml(n)}</option>`).join('');
 if(names.includes(current)) $('filterPlayer').value=current;
 render();
}
function render(){
 const player=$('filterPlayer').value;
 $('listTitle').textContent=activePosition+'の資料'+(player?'：'+player:'');
 $('selectionSummary').textContent=player?`${activePosition}／${player}`:'区分と選手名を選ぶと資料が表示されます';
 const list=entries.filter(x=>x.position===activePosition&&x.player===player).sort((a,b)=>b.created-a.created);
 $('count').textContent=list.length+'件';
 if(!player){$('cards').innerHTML='<div class="empty">選手名を選択してください。</div>';return}
 if(!list.length){$('cards').innerHTML='<div class="empty">この選手の資料はまだ登録されていません。</div>';return}
 $('cards').innerHTML=list.map(x=>`<article class="item"><div class="item-top"><div><div class="item-title">${escapeHtml(x.title)}</div><div class="item-meta">${escapeHtml(x.position)}・${escapeHtml(x.player)}・${new Date(x.created).toLocaleDateString('ja-JP')}</div></div><button class="danger" data-delete="${x.id}">削除</button></div><div class="item-body">${x.kind==='png'?`<img src="${x.data}" alt="${escapeHtml(x.title)}">`:`<a class="link-card" href="${escapeAttr(x.url)}" target="_blank" rel="noopener noreferrer"><span class="link-icon">↗</span><span>${escapeHtml(x.title)}<br><small style="font-weight:400">${escapeHtml(x.url)}</small></span></a>`}</div></article>`).join('');
 document.querySelectorAll('[data-delete]').forEach(btn=>btn.addEventListener('click',()=>{if(confirm('この資料を削除しますか？')){entries=entries.filter(x=>x.id!==btn.dataset.delete);save();refreshNames()}}));
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function escapeAttr(s){return escapeHtml(s)}
$('kind').addEventListener('change',()=>{const png=$('kind').value==='png';$('fileWrap').classList.toggle('hidden',!png);$('urlWrap').classList.toggle('hidden',png)});
document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{activePosition=t.dataset.position;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b===t));refreshNames()}));
$('filterPlayer').addEventListener('change',render);
$('add').addEventListener('click',async()=>{
 const kind=$('kind').value,position=$('position').value,player=$('player').value.trim(),title=$('title').value.trim();
 if(!player){alert('選手名を入力してください');return}
 if(!title){alert('表示名を入力してください');return}
 let record={id:crypto.randomUUID(),kind,position,player,title,created:Date.now()};
 if(kind==='png'){
  const file=$('file').files[0];if(!file){alert('PNGファイルを選択してください');return}
  if(file.type!=='image/png'){alert('PNG形式のファイルを選択してください');return}
  try{record.data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)})}catch(e){alert('画像を読み込めませんでした');return}
 }else{
  const url=$('url').value.trim();try{const u=new URL(url);if(!['http:','https:'].includes(u.protocol))throw 0;record.url=u.href}catch(e){alert('有効なhttps:// または http:// のURLを入力してください');return}
 }
 entries.push(record);
 try{save()}catch(e){entries.pop();alert('保存容量を超えた可能性があります。画像サイズを小さくして再度お試しください。');return}
 activePosition=position;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.position===position));
 refreshNames();$('filterPlayer').value=player;render();
 alert('登録しました');
});
$('clearForm').addEventListener('click',()=>{$('player').value='';$('title').value='';$('file').value='';$('url').value='';});
load();refreshNames();
</script>
</body>
</html>
